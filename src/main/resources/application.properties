# ===============================================================
# CARGA DO .env
# Importa o arquivo .env da raiz do projeto (opcional: nao quebra
# se o arquivo nao existir, ex.: em producao usando env vars reais).
# ===============================================================
spring.config.import=optional:file:.env[.properties]

# ===============================================================
# APPLICATION / SERVER
# ===============================================================
spring.application.name=${APP_NAME:url-shortening}
server.port=${SERVER_PORT:8080}

# ===============================================================
# DATASOURCE (PostgreSQL)
# ===============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_shortening}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================================================
# CACHE (Redis)
# ===============================================================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=${CACHE_TTL:3600000}
# ===============================================================
# CONNECTION POOL (HikariCP)
# ===============================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# ===============================================================
# JPA / HIBERNATE
# O schema e versionado pelo Flyway, entao o Hibernate apenas valida.
# ===============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================================================
# FLYWAY
# ===============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=classpath:db/migrations

# ===============================================================
# OUTRAS VARIÁVEIS
# ===============================================================
app.sqids.min-length=${SQIDS_MIN_LENGTH:7}
app.sqids.alphabet=${SQIDS_ALPHABET:0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz}

# ===============================================================
# OPEN API
# ===============================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/documentation.html
